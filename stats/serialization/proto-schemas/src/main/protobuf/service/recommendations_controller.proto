syntax = "proto3";

package service.dashboard;

option java_multiple_files = true;
option java_package = "ru.practicum.ewm.stats.proto";

import "message/user_predictions_request.proto";
import "message/recommended_event.proto";
import "message/similar_event_request.proto";
import "message/interactions_count_request.proto";

service RecommendationsController {

  rpc GetRecommendationsForUser (message.action.UserPredictionsRequestProto)
      returns (stream message.action.RecommendedEventProto);

  rpc GetSimilarEvents (message.action.SimilarEventsRequestProto)
      returns (stream message.action.RecommendedEventProto);

  rpc GetInteractionsCount (message.action.InteractionsCountRequestProto)
      returns (stream message.action.RecommendedEventProto);

}